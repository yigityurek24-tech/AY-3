<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kavuşmaya Geri Sayım ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      padding: 20px 15px;
      gap: 20px;
      position: relative;
      background-color: #0b0f19;
      overflow-x: hidden;
    }

    /* Arka Plan Konteyneri */
    .bg-slider {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
    }

    .bg-slider img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    .bg-slider img.active {
      opacity: 1;
    }

    /* Karartma Katmanı */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    /* Sayaç Kartı */
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 25px 15px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 2;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #e2e8f0;
      margin-bottom: 20px;
      font-weight: 300;
    }

    .timer-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 10px 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .time-box span {
      display: block;
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .time-box label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #cbd5e1;
    }

    /* Koşma Animasyonu */
    .runner-track {
      position: relative;
      width: 100%;
      height: 44px;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
      margin-bottom: 16px;
    }

    .runner {
      position: absolute;
      bottom: 2px;
      left: 0;
      font-size: 1.5rem;
      display: inline-block;
      animation: runTowards 5s ease-in-out infinite;
    }

    .target-girl {
      position: absolute;
      bottom: 2px;
      right: 8px;
      font-size: 1.5rem;
    }

    .heart-pop {
      position: absolute;
      top: -10px;
      right: 22px;
      font-size: 1.1rem;
      opacity: 0;
      animation: heartAppear 5s ease-in-out infinite;
    }

    @keyframes runTowards {
      0% { left: 4%; transform: scaleX(-1) translateY(0); }
      25% { transform: scaleX(-1) translateY(-3px); }
      50% { transform: scaleX(-1) translateY(0); }
      75% { transform: scaleX(-1) translateY(-3px); }
      88% { left: calc(100% - 60px); transform: scaleX(-1) translateY(0); }
      96% { left: calc(100% - 60px); transform: scaleX(-1) scale(1.1); }
      100% { left: 4%; transform: scaleX(-1) translateY(0); }
    }

    @keyframes heartAppear {
      0%, 82% { opacity: 0; transform: scale(0.5); }
      88%, 95% { opacity: 1; transform: scale(1.2) translateY(-8px); }
      100% { opacity: 0; transform: scale(0.5); }
    }

    .quote {
      font-style: italic;
      font-size: 0.85rem;
      color: #f1f5f9;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 14px;
    }

    /* Spotify Alanı */
    .spotify-wrapper {
      width: 100%;
      max-width: 480px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- 23 Görselin Tamamı (Doğrudan Depo İçi Göreli Yollar) -->
  <div class="bg-slider" id="slider">
    <img src="1.jpg" class="active" alt="">
    <img src="2.jpg" alt="">
    <img src="3.jpg" alt="">
    <img src="4.jpg" alt="">
    <img src="5.jpg" alt="">
    <img src="6.jpg" alt="">
    <img src="7.jpg" alt="">
    <img src="8.jpg" alt="">
    <img src="9.jpg" alt="">
    <img src="10.jpg" alt="">
    <img src="11.jpg" alt="">
    <img src="12.jpg" alt="">
    <img src="13.jpg" alt="">
    <img src="14.jpg" alt="">
    <img src="15.jpg" alt="">
    <img src="16.jpg" alt="">
    <img src="17.jpg" alt="">
    <img src="18.jpg" alt="">
    <img src="19.jpg" alt="">
    <img src="20.jpg" alt="">
    <img src="21.jpg" alt="">
    <img src="22.jpg" alt="">
    <img src="23.jpg" alt="">
  </div>
  
  <div class="overlay"></div>

  <!-- Sayaç Kartı -->
  <div class="card">
    <h1>Kavuşmamıza Kalan Süre</h1>
    <p class="subtitle">Aramızdaki mesafelerin biteceği güne doğru...</p>

    <div class="timer-container">
      <div class="time-box">
        <span id="days">00</span>
        <label>Gün</label>
      </div>
      <div class="time-box">
        <span id="hours">00</span>
        <label>Saat</label>
      </div>
      <div class="time-box">
        <span id="minutes">00</span>
        <label>Dakika</label>
      </div>
      <div class="time-box">
        <span id="seconds">00</span>
        <label>Saniye</label>
      </div>
    </div>

    <!-- Koşma Animasyonu -->
    <div class="runner-track">
      <span class="runner">🏃🏻‍♂️</span>
      <span class="heart-pop">💖</span>
      <span class="target-girl">🧍🏻‍♀️</span>
    </div>

    <div class="quote" id="footer-text">
      "Mesafe sadece bir sayıdan ibaret."
    </div>
  </div>

  <!-- Spotify Çalma Listesi -->
  <div class="spotify-wrapper">
    <iframe 
      style="border-radius:14px;" 
      src="https://open.spotify.com/embed/playlist/5rR15ZXGOmicj2WtpAyHim?utm_source=generator&theme=0" 
      width="100%" 
      height="152" 
      frameBorder="0" 
      allowfullscreen="" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy">
    </iframe>
  </div>

  <script>
    // 1. Sayaç Hesabı: 6 Eylül 2026 Saat 08:00
    const targetDate = new Date(2026, 8, 6, 8, 0, 0).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("days").innerText = "0";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
        document.getElementById("footer-text").innerText = "Sonunda birlikteyiz! ❤️";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
      document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // 2. Slayt Döngüsü
    const slides = Array.from(document.querySelectorAll('.bg-slider img'));
    let currentSlide = 0;

    setInterval(() => {
      if (slides.length > 1) {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
      }
    }, 4500);
  </script>
</body>
</html>
