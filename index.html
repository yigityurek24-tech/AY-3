<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AY❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      padding: 30px 20px;
      gap: 30px;
      background-color: #0b0f19;
      position: relative;
      overflow-x: hidden;
    }

    /* Arka Plan Konteyneri */
    .bg-slider {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .bg-slider img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .bg-slider img.active {
      opacity: 1;
    }

    /* Karartma Katmanı */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      z-index: 2;
    }

    /* Sayaç Kartı */
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 3;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 25px;
      font-weight: 300;
    }

    .timer-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .time-box span {
      display: block;
      font-size: 1.8rem;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .time-box label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #cbd5e1;
    }

    /* Koşma Animasyonu Pisti */
    .runner-track {
      position: relative;
      width: 100%;
      height: 48px;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
      margin-bottom: 20px;
      overflow: visible;
    }

    .runner {
      position: absolute;
      bottom: 2px;
      left: 0;
      font-size: 1.7rem;
      display: inline-block;
      animation: runTowards 5s ease-in-out infinite;
    }

    .target-girl {
      position: absolute;
      bottom: 2px;
      right: 12px;
      font-size: 1.7rem;
    }

    .heart-pop {
      position: absolute;
      top: -12px;
      right: 28px;
      font-size: 1.2rem;
      opacity: 0;
      animation: heartAppear 5s ease-in-out infinite;
    }

    @keyframes runTowards {
      0% { left: 5%; transform: scaleX(-1) translateY(0); }
      25% { transform: scaleX(-1) translateY(-4px); }
      50% { transform: scaleX(-1) translateY(0); }
      75% { transform: scaleX(-1) translateY(-4px); }
      88% { left: calc(100% - 70px); transform: scaleX(-1) translateY(0); }
      96% { left: calc(100% - 70px); transform: scaleX(-1) scale(1.1); }
      100% { left: 5%; transform: scaleX(-1) translateY(0); }
    }

    @keyframes heartAppear {
      0%, 82% { opacity: 0; transform: scale(0.5) translateY(0); }
      88%, 95% { opacity: 1; transform: scale(1.3) translateY(-10px); }
      100% { opacity: 0; transform: scale(0.5) translateY(0); }
    }

    .quote {
      font-style: italic;
      font-size: 0.9rem;
      color: #f1f5f9;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 18px;
    }

    /* Spotify Alanı */
    .spotify-wrapper {
      width: 100%;
      max-width: 540px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 3;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.6rem; }
      .timer-container { gap: 6px; }
      .time-box span { font-size: 1.35rem; }
      .time-box label { font-size: 0.6rem; }
      .card { padding: 25px 15px; }
    }
  </style>
</head>
<body>

  <!-- Arka Planda Dönen Fotoğraflar -->
  <div class="bg-slider">
    <img src="img/1.jpg" class="active" alt="Fotoğraf 1" onerror="this.src='img/1.jpeg'">
    <img src="img/2.jpg" alt="Fotoğraf 2" onerror="this.src='img/2.jpeg'">
    <img src="img/3.jpg" alt="Fotoğraf 3" onerror="this.src='img/3.jpeg'">
  </div>
  <div class="overlay"></div>

  <!-- Sayaç Kartı -->
  <div class="card">
    <h1>Kavuşmamıza Kalan Süre</h1>
    <p class="subtitle">Şu kadarcık kalmışşş</p>

    <div class="timer-container">
      <div class="time-box">
        <span id="days">00</span>
        <label>Gün</label>
      </div>
      <div class="time-box">
        <span id="hours">00</span>
        <label>Saat</label>
      </div>
      <div class="time-box">
        <span id="minutes">00</span>
        <label>Dakika</label>
      </div>
      <div class="time-box">
        <span id="seconds">00</span>
        <label>Saniye</label>
      </div>
    </div>

    <!-- Koşma Animasyonu -->
    <div class="runner-track">
      <span class="runner">🏃🏻‍♂️</span>
      <span class="heart-pop">💖</span>
      <span class="target-girl">🧍🏻‍♀️</span>
    </div>

    <div class="quote" id="footer-text">
      "Seni Çoooooook Seviyorumm
  "
    </div>
  </div>

  <!-- Spotify Oynatıcı -->
  <div class="spotify-wrapper">
    <iframe 
      style="border-radius:16px;" 
      src="https://open.spotify.com/embed/playlist/5rR15ZXGOmicj2WtpAyHim?utm_source=generator&theme=0" 
      width="100%" 
      height="352" 
      frameBorder="0" 
      allowfullscreen="" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy">
    </iframe>
  </div>

  <script>
    // 1. Sayaç: 6 Eylül 2026 Saat 08:00
    const targetDate = new Date(2026, 8, 6, 8, 0, 0).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("days").innerText = "0";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
        document.getElementById("footer-text").innerText = "Sonunda birlikteyiz! ❤️";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
      document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // 2. Slayt Mantığı (4.5 Saniyede Bir Geçiş)
    const slides = document.querySelectorAll('.bg-slider img');
    let currentSlide = 0;

    setInterval(() => {
      if (slides.length > 1) {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
      }
    }, 4500);
  </script>
</body>
</html>
